<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myDATA·app — Τιμολόγηση</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── CONFIG — αλλάξτε αυτά με τα δικά σας ───────────────────────────────────
const SUPABASE_URL = "";       // π.χ. https://xxxxx.supabase.co
const SUPABASE_KEY = "";       // anon public key

const MYDATA_SANDBOX = "https://mydataapidev.aade.gr/AADE-Public-api-myDATA-v1_0_8";
const MYDATA_PROD    = "https://mydataapi.aade.gr/AADE-Public-api-myDATA-v1_0_8";

// init supabase only if configured
const sb = (SUPABASE_URL && SUPABASE_KEY)
  ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

// ── DATA ────────────────────────────────────────────────────────────────────
const INVOICE_TYPES = [
  {v:"1.1",  l:"1.1 — Τιμολόγιο Πώλησης"},
  {v:"2.1",  l:"2.1 — Τιμολόγιο Παροχής Υπηρεσιών"},
  {v:"11.1", l:"11.1 — ΑΠΥ"},
  {v:"11.2", l:"11.2 — ΑΛΠ"},
];
const VAT_CATS = [
  {v:1,l:"24%",r:0.24},
  {v:2,l:"13%",r:0.13},
  {v:3,l:"6%", r:0.06},
  {v:4,l:"0% — Εξαιρούμενο",r:0},
];
const PMETHODS = [
  {v:1,l:"Επαγγελματικός Λογαριασμός"},
  {v:3,l:"Μετρητά"},
  {v:4,l:"Επιταγή"},
  {v:5,l:"Πίστωση (Credit)"},
  {v:6,l:"Κάρτα / Web Banking"},
  {v:7,l:"IRIS"},
];

const T = {
  bg:"#0d1117",sur:"#161b22",sur2:"#1e2530",brd:"#2a3441",
  acc:"#00c6ff",suc:"#00e676",war:"#ffb300",dan:"#ff5252",
  txt:"#e6edf3",mut:"#7d8590",
};

const fmt = n => Number(n||0).toLocaleString("el-GR",{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().split("T")[0];
const uid = () => Math.random().toString(36).slice(2);

const emptyLine = () => ({id:uid(),desc:"",qty:1,price:0,vatCat:1,net:0,vat:0});
const emptyInv  = () => ({
  type:"2.1",series:"Α",date:today(),
  cp:{name:"",afm:"",addr:"",city:"",country:"GR"},
  pm:3, lines:[emptyLine()], notes:"",
  status:"draft",mark:null,invUid:null,
});

function calcLine(l){
  const r = VAT_CATS.find(v=>v.v===l.vatCat)?.r||0;
  const net = l.qty * l.price;
  return {...l, net, vat:net*r};
}

// ── LOCAL STORAGE ────────────────────────────────────────────────────────────
function lsGet(k,def){ try{const s=localStorage.getItem(k);return s?JSON.parse(s):def}catch{return def} }
function lsSet(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch{} }

// ── XML ─────────────────────────────────────────────────────────────────────
function buildXML(inv, cfg, num){
  const net   = inv.lines.reduce((s,l)=>s+l.net,0);
  const vat   = inv.lines.reduce((s,l)=>s+l.vat,0);
  const gross = net+vat;
  const lines = inv.lines.map((l,i)=>`
    <invoiceDetails>
      <lineNumber>${i+1}</lineNumber>
      <netValue>${l.net.toFixed(2)}</netValue>
      <vatCategory>${l.vatCat}</vatCategory>
      <vatAmount>${l.vat.toFixed(2)}</vatAmount>
    </invoiceDetails>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>
<RequestDoc>
  <InvoicesDoc>
    <invoice>
      <issuer><vatNumber>${cfg.afm}</vatNumber><country>GR</country><branch>0</branch></issuer>
      ${inv.cp.afm?`<counterpart><vatNumber>${inv.cp.afm}</vatNumber><country>${inv.cp.country||"GR"}</country><branch>0</branch></counterpart>`:""}
      <invoiceHeader>
        <series>${inv.series}</series><aa>${num}</aa>
        <issueDate>${inv.date}</issueDate>
        <invoiceType>${inv.type}</invoiceType>
        <currency>EUR</currency>
      </invoiceHeader>
      <paymentMethods><paymentMethodDetails><type>${inv.pm}</type><amount>${gross.toFixed(2)}</amount></paymentMethodDetails></paymentMethods>
      ${lines}
      <invoiceSummary>
        <totalNetValue>${net.toFixed(2)}</totalNetValue>
        <totalVatAmount>${vat.toFixed(2)}</totalVatAmount>
        <totalWithheldAmount>0.00</totalWithheldAmount><totalFeesAmount>0.00</totalFeesAmount>
        <totalStampDutyAmount>0.00</totalStampDutyAmount><totalOtherTaxesAmount>0.00</totalOtherTaxesAmount>
        <totalDeductionsAmount>0.00</totalDeductionsAmount>
        <totalGrossValue>${gross.toFixed(2)}</totalGrossValue>
        <incomeClassification>
          <classificationType>E3_561_001</classificationType>
          <classificationCategory>category1_1</classificationCategory>
          <amount>${net.toFixed(2)}</amount>
        </incomeClassification>
      </invoiceSummary>
    </invoice>
  </InvoicesDoc>
</RequestDoc>`;
}

// ── PDF ──────────────────────────────────────────────────────────────────────
function makePDF(inv, cfg){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210;
  const net   = inv.lines.reduce((s,l)=>s+l.net,0);
  const vat   = inv.lines.reduce((s,l)=>s+l.vat,0);
  const gross = net+vat;
  const typeL = INVOICE_TYPES.find(t=>t.v===inv.type)?.l||inv.type;
  const pmL   = PMETHODS.find(p=>p.v===inv.pm)?.l||"";

  // Header
  doc.setFillColor(13,17,23); doc.rect(0,0,W,34,"F");
  doc.setTextColor(0,198,255); doc.setFontSize(20); doc.setFont("helvetica","bold");
  doc.text("myDATA\u00B7app",14,14);
  doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(125,133,144);
  doc.text("Τιμολόγηση & myDATA",14,20);
  doc.setFontSize(13); doc.setFont("helvetica","bold"); doc.setTextColor(230,237,243);
  doc.text(typeL,14,29);
  // number top-right
  doc.setFontSize(11); doc.setTextColor(0,198,255);
  doc.text(`${inv.series}${inv.number||""}`,W-14,14,{align:"right"});
  doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(125,133,144);
  doc.text(`Ημερομηνία: ${inv.date}`,W-14,20,{align:"right"});
  if(inv.mark){ doc.setTextColor(0,230,118); doc.text(`MARK: ${inv.mark}`,W-14,26,{align:"right"}); }

  let y=42; const cW=(W-28)/2;

  // Issuer / counterpart boxes
  [[14,"ΕΚΔΟΤΗΣ",[cfg.name||"—",cfg.addr||"",`ΑΦΜ: ${cfg.afm||"—"}`]],
   [14+cW+4,"ΑΝΤΙΣΥΜΒΑΛΛΟΜΕΝΟΣ",[inv.cp.name||"—",inv.cp.addr||"",inv.cp.afm?`ΑΦΜ: ${inv.cp.afm}`:"",inv.cp.city||""]]
  ].forEach(([x,title,rows])=>{
    doc.setFillColor(22,27,34); doc.roundedRect(x,y,cW,32,2,2,"F");
    doc.setFontSize(7); doc.setFont("helvetica","bold"); doc.setTextColor(125,133,144);
    doc.text(title,x+4,y+6);
    let ly=y+13;
    rows.forEach((r,i)=>{
      if(!r) return;
      doc.setFont("helvetica",i===0?"bold":"normal");
      doc.setFontSize(i===0?9:8);
      doc.setTextColor(i===0?[230,237,243]:[125,133,144]);
      doc.text(r,x+4,ly); ly+=5;
    });
  });
  y+=38;

  // Table
  doc.autoTable({
    startY:y,
    head:[["Περιγραφή","Ποσ.","Τιμή","ΦΠΑ","Καθαρό","ΦΠΑ €","Σύνολο"]],
    body:inv.lines.map(l=>[
      l.desc||"—", l.qty,
      `€${fmt(l.price)}`,
      VAT_CATS.find(v=>v.v===l.vatCat)?.l||"",
      `€${fmt(l.net)}`, `€${fmt(l.vat)}`,
      `€${fmt(l.net+l.vat)}`
    ]),
    styles:{fontSize:8,cellPadding:3,textColor:[230,237,243],fillColor:[22,27,34],lineColor:[42,52,65],lineWidth:0.2},
    headStyles:{fillColor:[13,17,23],textColor:[125,133,144],fontStyle:"bold",fontSize:7},
    alternateRowStyles:{fillColor:[30,37,48]},
    columnStyles:{0:{cellWidth:54},1:{cellWidth:12,halign:"center"},2:{cellWidth:22,halign:"right"},3:{cellWidth:16,halign:"center"},4:{cellWidth:26,halign:"right"},5:{cellWidth:20,halign:"right"},6:{cellWidth:26,halign:"right"}},
    margin:{left:14,right:14},
  });

  y = doc.lastAutoTable.finalY+8;

  // Totals
  const tx=W-14-68;
  doc.setFillColor(13,17,23); doc.roundedRect(tx,y,68,34,2,2,"F");
  [[`Καθαρή αξία:`,`€${fmt(net)}`],[`ΦΠΑ:`,`€${fmt(vat)}`],[`ΣΥΝΟΛΟ:`,`€${fmt(gross)}`]].forEach(([l,v],i)=>{
    const ty=y+10+i*8;
    doc.setFontSize(i===2?10:8); doc.setFont("helvetica",i===2?"bold":"normal");
    doc.setTextColor(i===2?[0,198,255]:[125,133,144]);
    doc.text(l,tx+4,ty);
    doc.setTextColor(i===2?[0,198,255]:[230,237,243]);
    doc.text(v,tx+64,ty,{align:"right"});
  });

  doc.setFontSize(8); doc.setFont("helvetica","normal"); doc.setTextColor(125,133,144);
  doc.text(`Τρόπος πληρωμής: ${pmL}`,14,y+8);
  if(inv.notes) doc.text(`Παρατηρήσεις: ${inv.notes}`,14,y+16);

  // Footer
  doc.setFillColor(13,17,23); doc.rect(0,283,W,14,"F");
  doc.setFontSize(7); doc.setTextColor(125,133,144);
  doc.text("Παράχθηκε από myDATA·app",W/2,291,{align:"center"});
  if(inv.invUid) doc.text(`UID: ${inv.invUid}`,14,291);

  doc.save(`${inv.series}${inv.number||"draft"}_${inv.date}.pdf`);
}

const css = {
  sidebar:{position:"fixed",top:0,left:0,width:220,height:"100vh",background:T.sur,borderRight:`1px solid ${T.brd}`,display:"flex",flexDirection:"column",zIndex:100},
  logo:{padding:"20px 20px 14px",borderBottom:`1px solid ${T.brd}`,fontSize:18,fontWeight:700,color:T.acc,letterSpacing:-0.5},

  nav:(a)=>({display:"flex",alignItems:"center",gap:10,padding:"11px 20px",cursor:"pointer",background:a?T.sur2:"transparent",color:a?T.acc:T.mut,borderLeft:`3px solid ${a?T.acc:"transparent"}`,fontSize:13,fontWeight:a?600:400,userSelect:"none"}),

  sel:{width:"100%",background:T.sur2,border:`1px solid ${T.brd}`,borderRadius:8,padding:"9px 12px",color:T.txt,fontSize:13,outline:"none",boxSizing:"border-box"},

  th:{textAlign:"left",padding:"9px 12px",fontSize:11,fontWeight:600,color:T.mut,borderBottom:`1px solid ${T.brd}`,textTransform:"uppercase",letterSpacing:0.5},
  td:{padding:"11px 12px",fontSize:13,borderBottom:`1px solid ${T.brd}`,verticalAlign:"middle"},
  kpi:{background:T.sur2,border:`1px solid ${T.brd}`,borderRadius:12,padding:"20px 22px",flex:1,minWidth:150},
  div:{borderTop:`1px solid ${T.brd}`,margin:"18px 0"},
  toast:(t)=>({position:"fixed",bottom:24,right:24,zIndex:9999,background:t==="s"?"#00e67611":"#ff525211",border:`1px solid ${t==="s"?T.suc:T.dan}`,color:t==="s"?T.suc:T.dan,borderRadius:10,padding:"12px 20px",fontSize:13,fontWeight:500,boxShadow:"0 4px 20px #00000044"}),
  ham:{position:"fixed",top:14,left:14,zIndex:200,background:T.sur,border:`1px solid ${T.brd}`,borderRadius:8,padding:"7px 10px",cursor:"pointer",color:T.txt,fontSize:18,lineHeight:1},
  overlay:{position:"fixed",inset:0,background:"#000000aa",zIndex:99},
  authWrap:{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"},
  authCard:{background:T.sur,border:`1px solid ${T.brd}`,borderRadius:16,padding:40,width:360,maxWidth:"90vw"},

// AUTH SCREEN
// ═══════════════════════════════════════════════════════════════════════════════
function AuthScreen({onLogin}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");

  const submit = async()=>{
    if(!sb){ onLogin({id:"demo",email:"demo@local",demo:true}); return; }
    setLoading(true); setErr("");
    try{
      let r;
      if(mode==="login") r=await sb.auth.signInWithPassword({email,password:pass});
      else if(mode==="reg"){ r=await sb.auth.signUp({email,password:pass}); if(!r.error){setMsg("Έλεγξε το email σου!"); return;} }
      else { r=await sb.auth.resetPasswordForEmail(email); if(!r.error){setMsg("Στάλθηκε email επαναφοράς!"); return;} }
      if(r.error){setErr(r.error.message); return;}
      if(r.data?.user) onLogin(r.data.user);
    }finally{setLoading(false);}
  };

  const onKey = e => e.key==="Enter" && submit();

  return (
    <div style={css.authWrap}>
      <div style={css.authCard}>
        <div style={{fontSize:24,fontWeight:700,color:T.acc,marginBottom:3}}>myDATA<span style={{color:T.mut}}>·app</span></div>
        <div style={{fontSize:12,color:T.mut,marginBottom:26}}>Τιμολόγηση & myDATA για ελεύθερους επαγγελματίες</div>

        {!sb&&<div style={{padding:"10px 12px",background:"#ffb30011",border:`1px solid ${T.war}`,borderRadius:8,fontSize:11,color:T.war,marginBottom:20}}>
          🟡 Demo mode — τα δεδομένα αποθηκεύονται τοπικά (localStorage)
        </div>}

        <div style={{display:"flex",gap:8,marginBottom:20}}>
          {[["login","Σύνδεση"],["reg","Εγγραφή"]].map(([m,l])=>(
            <button key={m} style={{...css.btn(mode===m?"primary":"ghost"),flex:1,padding:"8px"}} onClick={()=>{setMode(m);setErr("");setMsg("");}}>{l}</button>
          ))}
        </div>

        {msg?<div style={{padding:14,background:"#00e67611",border:`1px solid ${T.suc}`,borderRadius:8,color:T.suc,fontSize:13}}>{msg}</div>:<>
          <label style={css.lbl}>Email</label>
          <input style={{...css.inp,marginBottom:14}} type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={onKey}/>
          {mode!=="forgot"&&<>
            <label style={css.lbl}>Κωδικός</label>
            <input style={{...css.inp,marginBottom:20}} type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={onKey}/>
          </>}
          {err&&<div style={{color:T.dan,fontSize:12,marginBottom:12}}>{err}</div>}
          <button style={{...css.btn("primary"),width:"100%",opacity:loading?0.6:1}} onClick={submit} disabled={loading}>
            {loading?"⏳ ...":mode==="login"?"Σύνδεση →":mode==="reg"?"Δημιουργία λογαριασμού":"Αποστολή email"}
          </button>
          {mode==="login"&&<div style={{textAlign:"center",marginTop:12}}>
            <span style={{color:T.acc,fontSize:12,cursor:"pointer"}} onClick={()=>setMode("forgot")}>Ξέχασες τον κωδικό;</span>
          </div>}
        </>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════════════════
function App(){
  const [user,setUser]       = useState(null);
  const [authOk,setAuthOk]   = useState(false);
  const [page,setPage]       = useState("dashboard");
  const [cfg,setCfgState]    = useState(()=>lsGet("myd_cfg",{name:"",afm:"",addr:"",userId:"",subKey:"",sandbox:true,nextNum:1,series:"Α",gsisUser:"",gsisPass:""}));
  const [invoices,setInvState]= useState(()=>lsGet("myd_inv",[]));
  const [draft,setDraft]     = useState(emptyInv());
  const [toast,setToast]     = useState(null);
  const [loading,setLoading] = useState(false);
  const [mobMenu,setMob]     = useState(false);
  const [isMob,setIsMob]     = useState(window.innerWidth<768);
  const [gsisStatus,setGsisStatus] = useState(null); // null | "loading" | "ok" | "err"
  const [gsisErr,setGsisErr]       = useState("");
  const [gsisInfo,setGsisInfo]     = useState(null);

  const lookupGsis = async () => {
    const afm = draft.cp.afm?.trim();
    if(!afm||afm.length<9){ setGsisErr("Εισάγετε έγκυρο ΑΦΜ (9 ψηφία)"); setGsisStatus("err"); return; }
    if(!cfg.gsisUser||!cfg.gsisPass){ setGsisErr("Συμπλήρωσε ΓΓΠΣ credentials στις Ρυθμίσεις"); setGsisStatus("err"); return; }
    setGsisStatus("loading"); setGsisErr(""); setGsisInfo(null);
    try {
      const res = await fetch("/.netlify/functions/gsis-lookup",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ afm, calledByAfm:cfg.afm, username:cfg.gsisUser, password:cfg.gsisPass }),
      });
      const json = await res.json();
      if(json.error){ setGsisErr(json.error); setGsisStatus("err"); return; }
      const d = json.data;
      setGsisInfo(d);
      setGsisStatus("ok");
      // Autofill counterpart fields
      setDraft(prev=>({...prev, cp:{
        ...prev.cp,
        name:    d.name || d.fullName || prev.cp.name,
        addr:    d.address || prev.cp.addr,
        city:    d.city || prev.cp.city,
        country: "GR",
        doy:     d.doy || "",
      }}));
    } catch(e){ setGsisErr("Σφάλμα σύνδεσης: "+e.message); setGsisStatus("err"); }
  };

  // Responsive
  useEffect(()=>{
    const fn=()=>setIsMob(window.innerWidth<768);
    window.addEventListener("resize",fn);
    return()=>window.removeEventListener("resize",fn);
  },[]);

  // Auth check
  useEffect(()=>{
    if(!sb){setAuthOk(true);return;}
    sb.auth.getSession().then(({data:{session}})=>{
      if(session?.user) setUser(session.user);
      setAuthOk(true);
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setUser(s?.user||null));
    return()=>subscription.unsubscribe();
  },[]);

  // Supabase load
  useEffect(()=>{
    if(!sb||!user||user.demo) return;
    sb.from("user_settings").select("settings").eq("user_id",user.id).single()
      .then(({data})=>{ if(data?.settings) saveCfg(data.settings,false); });
    sb.from("invoices").select("payload").eq("user_id",user.id).order("created_at",{ascending:false})
      .then(({data})=>{ if(data?.length){ const arr=data.map(d=>d.payload); setInvState(arr); lsSet("myd_inv",arr); }});
  },[user]);

  const saveCfg = (val,sync=true)=>{
    setCfgState(val); lsSet("myd_cfg",val);
    if(sync&&sb&&user&&!user.demo)
      sb.from("user_settings").upsert({user_id:user.id,settings:val},{onConflict:"user_id"});
  };

  const addInv = async(inv)=>{
    const arr=[inv,...invoices];
    setInvState(arr); lsSet("myd_inv",arr);
    if(sb&&user&&!user.demo)
      await sb.from("invoices").insert({
        user_id:user.id,series:inv.series,number:inv.number,
        issue_date:inv.date,invoice_type:inv.type,
        counterpart_name:inv.cp?.name,counterpart_vat:inv.cp?.afm,

        status:inv.status,mark:inv.mark,uid:inv.invUid,payload:inv,

  // Calcs
  const totalNet   = draft.lines.reduce((s,l)=>s+l.net,0);
  const totalVat   = draft.lines.reduce((s,l)=>s+l.vat,0);
  const totalGross = totalNet+totalVat;

  const updLine=(idx,field,val)=>{
    setDraft(d=>({...d,lines:d.lines.map((l,i)=>i!==idx?l:calcLine({...l,[field]:val}))}));

  // myDATA submit
  const submitMyData = async()=>{
    if(!cfg.afm||!cfg.userId||!cfg.subKey){ toast$("Συμπλήρωσε τα credentials στις Ρυθμίσεις","e"); return; }
    setLoading(true);
    try{
      const num = cfg.nextNum;
      const xml = buildXML(draft, cfg, num);
      const url = (cfg.sandbox?MYDATA_SANDBOX:MYDATA_PROD)+"/SendInvoices";
      const res = await fetch(url,{method:"POST",headers:{"Content-Type":"application/xml","aade-user-id":cfg.userId,"Ocp-Apim-Subscription-Key":cfg.subKey},body:xml});
      const txt = await res.text();
      const mark = txt.match(/<mark>(\d+)<\/mark>/)?.[1]||null;
      const invUid  = txt.match(/<uid>([^<]+)<\/uid>/)?.[1]||null;
      if(res.ok&&mark){
        const saved={...draft,id:Date.now(),number:num,issueDate:draft.date,mark,invUid,totalNet,totalVat,totalGross,status:"sent",cpName:draft.cp.name};
        await addInv(saved);
        saveCfg({...cfg,nextNum:num+1});
        toast$(`✅ Εστάλη! MARK: ${mark}`);
        setDraft(emptyInv()); go("invoices");
      } else {
        const errMsg=txt.match(/<message>([^<]+)<\/message>/)?.[1]||"Σφάλμα αποστολής";
        toast$(errMsg,"e");
      }
    }catch(e){toast$("Σφάλμα: "+e.message,"e");}
    finally{setLoading(false);}
  };

          <div style={css.row}>
            <div style={css.col()}><label style={css.lbl}>ΓΓΠΣ Username</label><input style={css.inp} placeholder="ειδικός κωδικός ΓΓΠΣ" value={lc.gsisUser} onChange={e=>setLc({...lc,gsisUser:e.target.value})}/></div>
            <div style={css.col()}><label style={css.lbl}>ΓΓΠΣ Password</label><input style={{...css.inp,fontFamily:"monospace"}} type="password" placeholder="••••••••" value={lc.gsisPass} onChange={e=>setLc({...lc,gsisPass:e.target.value})}/></div>
          </div>
        </div>
        <div style={css.card}>
          <div style={css.title}>📋 Αρίθμηση</div>
          <div style={css.row}>
            <div style={css.col(0.5)}><label style={css.lbl}>Σειρά</label><input style={css.inp} value={lc.series} onChange={e=>setLc({...lc,series:e.target.value})}/></div>
            <div style={css.col(0.5)}><label style={css.lbl}>Επόμενος Α/Α</label><input type="number" style={css.inp} value={lc.nextNum} onChange={e=>setLc({...lc,nextNum:Number(e.target.value)})}/></div>
          </div>
        </div>
        {sb&&user&&!user.demo&&(
          <div style={{...css.card,borderColor:"#00e67644"}}>
            <div style={{color:T.suc,fontWeight:600,marginBottom:4}}>☁️ Cloud Sync ενεργό</div>
            <div style={{fontSize:12,color:T.mut}}>Τα δεδομένα συγχρονίζονται με Supabase — <strong style={{color:T.txt}}>{user.email}</strong></div>
          </div>
        )}
        <div style={{display:"flex",justifyContent:"flex-end",gap:12,paddingBottom:32}}>
          {invoices.length>0&&<button style={{...css.btn("danger"),opacity:0.75}} onClick={()=>{ if(confirm("Διαγραφή ΟΛΩΝ των παραστατικών;")){ setInvState([]); lsSet("myd_inv",[]); toast$("Διαγράφηκαν"); }}}>Εκκαθάριση</button>}
          <button style={css.btn("primary")} onClick={()=>{ saveCfg(lc); toast$("Αποθηκεύτηκαν"); }}>Αποθήκευση</button>
        </div>
      </div>
    );
  };

  // ── RENDER ──────────────────────────────────────────────────────────────────
  if(!authOk) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:T.mut}}>Φόρτωση...</div>;
  if(!user) return <AuthScreen onLogin={u=>setUser(u)}/>;

  return(
    <div style={{fontFamily:"'Inter','Segoe UI',system-ui,sans-serif",background:T.bg,color:T.txt,minHeight:"100vh",fontSize:14}}>
      {isMob&&<button style={css.ham} onClick={()=>setMob(!mobMenu)}>☰</button>}
      {isMob&&mobMenu&&<div style={css.overlay} onClick={()=>setMob(false)}/>}
      {(!isMob||mobMenu)&&<Sidebar/>}
      <div style={isMob?css.mainMob:css.main}>
        {page==="dashboard"&&<Dashboard/>}
        {page==="new"&&<NewInvoice/>}
        {page==="invoices"&&<InvList/>}
        {page==="settings"&&<Settings/>}
      </div>
      {toast&&<div style={css.toast(toast.t)}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
