const MYDATA_PROD    = "https://mydataapi.aade.gr/AADE-Public-api-myDATA-v1_0_8";
const sb = (SUPABASE_URL && SUPABASE_KEY) ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const INVOICE_TYPES = [
  {v:"1.1",  l:"1.1 — Τιμολόγιο Πώλησης"},
  {v:"2.1",  l:"2.1 — Τιμολόγιο Παροχής Υπηρεσιών"},
  {v:"11.1", l:"11.1 — ΑΠΥ"},
  {v:"11.2", l:"11.2 — ΑΛΠ"},
];
const VAT_CATS = [
  {v:1,l:"24%",r:0.24},{v:2,l:"13%",r:0.13},{v:3,l:"6%",r:0.06},{v:4,l:"0% — Εξαιρούμενο",r:0},
];
const PMETHODS = [
  {v:1,l:"Επαγγελματικός Λογαριασμός"},{v:3,l:"Μετρητά"},{v:4,l:"Επιταγή"},
  {v:5,l:"Πίστωση (Credit)"},{v:6,l:"Κάρτα / Web Banking"},{v:7,l:"IRIS"},
];

const fmt = n => Number(n||0).toLocaleString("el-GR",{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().split("T")[0];
const uid = () => Math.random().toString(36).slice(2);
const emptyLine = () => ({id:uid(),desc:"",qty:1,price:0,vatCat:1,net:0,vat:0});
const emptyInv = () => ({type:"2.1",series:"Α",date:today(),cp:{name:"",afm:"",addr:"",city:"",country:"GR"},pm:3,lines:[emptyLine()],notes:"",status:"draft",mark:null,invUid:null});
const calcLine = l => { const r=VAT_CATS.find(v=>v.v===l.vatCat)?.r||0; const net=l.qty*l.price; return {...l,net,vat:net*r}; };
const lsGet = (k,d) => { try{const s=localStorage.getItem(k);return s?JSON.parse(s):d}catch{return d} };
const lsSet = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v))}catch{} };

// ── XML builder ───────────────────────────────────────────────────────────────
function buildXML(inv,cfg,num){
  const net=inv.lines.reduce((s,l)=>s+l.net,0);
  const vat=inv.lines.reduce((s,l)=>s+l.vat,0);
  const gross=net+vat;
  const lines=inv.lines.map((l,i)=>`
    <invoiceDetails>
      <lineNumber>${i+1}</lineNumber>
      <netValue>${l.net.toFixed(2)}</netValue>
      <vatCategory>${l.vatCat}</vatCategory>
      <vatAmount>${l.vat.toFixed(2)}</vatAmount>
    </invoiceDetails>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>
<RequestDoc><InvoicesDoc><invoice>
  <issuer><vatNumber>${cfg.afm}</vatNumber><country>GR</country><branch>0</branch></issuer>
  ${inv.cp.afm?`<counterpart><vatNumber>${inv.cp.afm}</vatNumber><country>${inv.cp.country||"GR"}</country><branch>0</branch></counterpart>`:""}
  <invoiceHeader>
    <series>${inv.series}</series><aa>${num}</aa>
    <issueDate>${inv.date}</issueDate>
    <invoiceType>${inv.type}</invoiceType>
    <currency>EUR</currency>
  </invoiceHeader>
  <paymentMethods><paymentMethodDetails><type>${inv.pm}</type><amount>${gross.toFixed(2)}</amount></paymentMethodDetails></paymentMethods>
  ${lines}
  <invoiceSummary>
    <totalNetValue>${net.toFixed(2)}</totalNetValue>
    <totalVatAmount>${vat.toFixed(2)}</totalVatAmount>
    <totalWithheldAmount>0.00</totalWithheldAmount><totalFeesAmount>0.00</totalFeesAmount>
    <totalStampDutyAmount>0.00</totalStampDutyAmount><totalOtherTaxesAmount>0.00</totalOtherTaxesAmount>
    <totalDeductionsAmount>0.00</totalDeductionsAmount>
    <totalGrossValue>${gross.toFixed(2)}</totalGrossValue>
    <incomeClassification>
      <classificationType>E3_561_001</classificationType>
      <classificationCategory>category1_1</classificationCategory>
      <amount>${net.toFixed(2)}</amount>
    </incomeClassification>
  </invoiceSummary>
</invoice></InvoicesDoc></RequestDoc>`;
}

// ── PDF ───────────────────────────────────────────────────────────────────────
function makePDF(inv,cfg){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210;
  const net=inv.lines.reduce((s,l)=>s+l.net,0);
  const vat=inv.lines.reduce((s,l)=>s+l.vat,0);
  const gross=net+vat;
  const typeL=INVOICE_TYPES.find(t=>t.v===inv.type)?.l||inv.type;
  const pmL=PMETHODS.find(p=>p.v===inv.pm)?.l||"";

  // Clean white header
  doc.setFillColor(255,255,255);
  doc.rect(0,0,W,42,"F");
  doc.setDrawColor(229,231,235);
  doc.setLineWidth(0.3);
  doc.line(0,42,W,42);

  // Logo
  doc.setFontSize(16);doc.setFont("helvetica","bold");doc.setTextColor(17,24,39);
  doc.text("myDATA",14,16);
  doc.setTextColor(107,114,128);doc.text("·app",14+doc.getTextWidth("myDATA"),16);
  doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(107,114,128);
  doc.text("Τιμολόγηση & myDATA",14,22);

  // Invoice type + number right
  doc.setFontSize(11);doc.setFont("helvetica","bold");doc.setTextColor(17,24,39);
  doc.text(typeL,W-14,16,{align:"right"});
  doc.setFontSize(10);doc.setTextColor(37,99,235);
  doc.text(`${inv.series}${inv.number||""}`,W-14,22,{align:"right"});
  doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(107,114,128);
  doc.text(inv.date,W-14,27,{align:"right"});
  if(inv.mark){doc.setTextColor(5,150,105);doc.text(`MARK: ${inv.mark}`,W-14,32,{align:"right"});}

  let y=52; const cW=(W-30)/2;
  [[14,"ΕΚΔΟΤΗΣ",[cfg.name||"—",cfg.addr||"",`ΑΦΜ: ${cfg.afm||"—"}`]],
   [14+cW+2,"ΑΝΤΙΣΥΜΒΑΛΛΟΜΕΝΟΣ",[inv.cp.name||"—",inv.cp.addr||"",inv.cp.afm?`ΑΦΜ: ${inv.cp.afm}`:"",inv.cp.city||""]]
  ].forEach(([x,title,rows])=>{
    doc.setFillColor(249,250,251);doc.roundedRect(x,y,cW,28,2,2,"F");
    doc.setDrawColor(229,231,235);doc.setLineWidth(0.2);doc.roundedRect(x,y,cW,28,2,2,"S");
    doc.setFontSize(7);doc.setFont("helvetica","bold");doc.setTextColor(107,114,128);
    doc.text(title,x+5,y+6);
    let ly=y+13;
    rows.forEach((r,i)=>{
      if(!r)return;
      doc.setFont("helvetica",i===0?"bold":"normal");
      doc.setFontSize(i===0?9:8);
      doc.setTextColor(i===0?[17,24,39]:[107,114,128]);
      doc.text(r,x+5,ly);ly+=5;
    });
  });
  y+=34;

  doc.autoTable({
    startY:y,
    head:[["Περιγραφή","Ποσ.","Τιμή","ΦΠΑ","Καθαρό","ΦΠΑ €","Σύνολο"]],
    body:inv.lines.map(l=>[l.desc||"—",l.qty,`€${fmt(l.price)}`,VAT_CATS.find(v=>v.v===l.vatCat)?.l||"",`€${fmt(l.net)}`,`€${fmt(l.vat)}`,`€${fmt(l.net+l.vat)}`]),
    styles:{fontSize:8,cellPadding:3.5,textColor:[17,24,39],fillColor:[255,255,255],lineColor:[229,231,235],lineWidth:0.2},
    headStyles:{fillColor:[249,250,251],textColor:[107,114,128],fontStyle:"bold",fontSize:7},
    alternateRowStyles:{fillColor:[249,250,251]},
    columnStyles:{0:{cellWidth:55},1:{cellWidth:12,halign:"center"},2:{cellWidth:22,halign:"right"},3:{cellWidth:16,halign:"center"},4:{cellWidth:26,halign:"right"},5:{cellWidth:20,halign:"right"},6:{cellWidth:25,halign:"right"}},
    margin:{left:14,right:14},
  });

  y=doc.lastAutoTable.finalY+10;
  const tx=W-14-70;
  doc.setFillColor(249,250,251);doc.roundedRect(tx,y,70,36,2,2,"F");
  doc.setDrawColor(229,231,235);doc.setLineWidth(0.2);doc.roundedRect(tx,y,70,36,2,2,"S");
  [[`Καθαρή αξία:`,`€${fmt(net)}`],[`ΦΠΑ:`,`€${fmt(vat)}`],[`Σύνολο:`,`€${fmt(gross)}`]].forEach(([l,v],i)=>{
    const ty=y+10+i*9;
    doc.setFontSize(i===2?10:8.5);doc.setFont("helvetica",i===2?"bold":"normal");
    doc.setTextColor(i===2?[17,24,39]:[107,114,128]);
    doc.text(l,tx+5,ty);
    doc.setTextColor(i===2?[37,99,235]:[17,24,39]);
    doc.text(v,tx+66,ty,{align:"right"});
  });
  doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(107,114,128);
  doc.text(`Τρόπος πληρωμής: ${pmL}`,14,y+8);
  if(inv.notes)doc.text(`Παρατηρήσεις: ${inv.notes}`,14,y+16);

  // Footer
  doc.setDrawColor(229,231,235);doc.setLineWidth(0.3);doc.line(14,283,W-14,283);
  doc.setFontSize(7);doc.setTextColor(107,114,128);
  doc.text("myDATA·app — apptimologio.netlify.app",W/2,289,{align:"center"});
  if(inv.invUid)doc.text(`UID: ${inv.invUid}`,14,289);

  doc.save(`${inv.series}${inv.number||"draft"}_${inv.date}.pdf`);
}

// AUTH SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function AuthScreen({onLogin}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");

  const submit=async()=>{
    if(!sb){onLogin({id:"demo",email:"demo@local",demo:true});return;}
    setLoading(true);setErr("");
    try{
      let r;
      if(mode==="login") r=await sb.auth.signInWithPassword({email,password:pass});
      else if(mode==="reg"){r=await sb.auth.signUp({email,password:pass});if(!r.error){setMsg("Έλεγξε το email σου!");return;}}
      else{r=await sb.auth.resetPasswordForEmail(email);if(!r.error){setMsg("Στάλθηκε email!");return;}}
      if(r.error){setErr(r.error.message);return;}
      if(r.data?.user)onLogin(r.data.user);
    }finally{setLoading(false);}
  };

  return(
    <div style={{minHeight:"100vh",background:"#f8f9fa",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.white,border:`1px solid ${C.border}`,borderRadius:16,padding:40,width:400,maxWidth:"100%",boxShadow:"0 4px 24px rgba(0,0,0,.06)"}}>
        <div style={{marginBottom:28}}>
          <div style={{fontSize:22,fontWeight:700,color:C.text,marginBottom:4}}>
            myDATA<span style={{color:C.blue}}>·app</span>
          </div>
          <div style={{color:C.muted,fontSize:14}}>Τιμολόγηση & myDATA για ελεύθερους επαγγελματίες</div>
        </div>

        {!sb&&<div style={{padding:"10px 14px",background:C.orangeL,border:`1px solid #fde68a`,borderRadius:8,fontSize:12,color:C.orange,marginBottom:20}}>
          Demo mode — τα δεδομένα αποθηκεύονται τοπικά
        </div>}

        <div style={{display:"flex",gap:4,marginBottom:24,background:"#f3f4f6",borderRadius:8,padding:4}}>
          {[["login","Σύνδεση"],["reg","Εγγραφή"]].map(([m,l])=>(
            <button key={m} style={{flex:1,padding:"8px",borderRadius:6,border:"none",cursor:"pointer",fontSize:13,fontWeight:500,
              background:mode===m?C.white:"transparent",color:mode===m?C.text:C.muted,
              boxShadow:mode===m?"0 1px 3px rgba(0,0,0,.1)":"none"}} onClick={()=>{setMode(m);setErr("");setMsg("");}}>
              {l}
            </button>
          ))}
        </div>

        {msg?<div style={{padding:14,background:C.greenL,border:`1px solid #a7f3d0`,borderRadius:8,color:C.green,fontSize:13}}>{msg}</div>:<>
          <div style={{marginBottom:14}}>
            <label style={lbl}>Email</label>
            <input style={inp} type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
          </div>
          {mode!=="forgot"&&<div style={{marginBottom:22}}>
            <label style={lbl}>Κωδικός</label>
            <input style={inp} type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/>
          </div>}
          {err&&<div style={{color:C.red,fontSize:12,marginBottom:12,padding:"8px 12px",background:C.redL,borderRadius:6}}>{err}</div>}
          <button style={{...btn("primary"),width:"100%",justifyContent:"center",opacity:loading?.6:1}} onClick={submit} disabled={loading}>
            {loading?"Φόρτωση...":mode==="login"?"Σύνδεση":mode==="reg"?"Δημιουργία λογαριασμού":"Αποστολή email"}
          </button>
          {mode==="login"&&<div style={{textAlign:"center",marginTop:14}}>
            <span style={{color:C.blue,fontSize:13,cursor:"pointer"}} onClick={()=>setMode("forgot")}>Ξέχασες τον κωδικό;</span>
          </div>}
        </>}
      </div>
    </div>
  );
}

// MAIN APP
// ─────────────────────────────────────────────────────────────────────────────
function App(){
  const [user,setUser]     = useState(null);
  const [authOk,setAuthOk] = useState(false);
  const [page,setPage]     = useState("dashboard");
  const [cfg,setCfgRaw]    = useState(()=>lsGet("myd_cfg",{name:"",afm:"",addr:"",userId:"",subKey:"",sandbox:true,nextNum:1,series:"Α"}));
  const [invoices,setInvs] = useState(()=>lsGet("myd_inv",[]));
  const [draft,setDraft]   = useState(emptyInv());
  const [toast,setToast]   = useState(null);
  const [loading,setLoad]  = useState(false);
  const [mob,setMob]       = useState(false);
  const [isMob,setIsMob]   = useState(window.innerWidth<768);
  const [gsis,setGsis]     = useState({status:null,err:"",info:null}); // status: null|loading|ok|err

  useEffect(()=>{
    const fn=()=>setIsMob(window.innerWidth<768);
    window.addEventListener("resize",fn);
    return()=>window.removeEventListener("resize",fn);
  },[]);

  useEffect(()=>{
    if(!sb){setAuthOk(true);return;}
    sb.auth.getSession().then(({data:{session}})=>{if(session?.user)setUser(session.user);setAuthOk(true);});
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setUser(s?.user||null));
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!sb||!user||user.demo)return;
    sb.from("user_settings").select("settings").eq("user_id",user.id).single().then(({data})=>{if(data?.settings)saveCfg(data.settings,false);});
    sb.from("invoices").select("payload").eq("user_id",user.id).order("created_at",{ascending:false}).then(({data})=>{if(data?.length){const a=data.map(d=>d.payload);setInvs(a);lsSet("myd_inv",a);}});
  },[user]);

  const saveCfg=(val,sync=true)=>{setCfgRaw(val);lsSet("myd_cfg",val);if(sync&&sb&&user&&!user.demo)sb.from("user_settings").upsert({user_id:user.id,settings:val},{onConflict:"user_id"});};
  const addInv=async(inv)=>{const a=[inv,...invoices];setInvs(a);lsSet("myd_inv",a);if(sb&&user&&!user.demo)await sb.from("invoices").insert({user_id:user.id,series:inv.series,number:inv.number,issue_date:inv.date,invoice_type:inv.type,counterpart_name:inv.cp?.name,counterpart_vat:inv.cp?.afm,total_net:inv.totalNet,total_vat:inv.totalVat,total_gross:inv.totalGross,status:inv.status,mark:inv.mark,uid:inv.invUid,payload:inv});};
  const toast$=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),3800);};
  const go=pg=>{setPage(pg);setMob(false);if(pg==="new"){setDraft(emptyInv());setGsis({status:null,err:"",info:null});}};
  const signOut=async()=>{if(sb)await sb.auth.signOut();setUser(null);};

  const totalNet   = draft.lines.reduce((s,l)=>s+l.net,0);
  const totalVat   = draft.lines.reduce((s,l)=>s+l.vat,0);
  const totalGross = totalNet+totalVat;
  const updLine=(i,f,v)=>setDraft(d=>({...d,lines:d.lines.map((l,j)=>j!==i?l:calcLine({...l,[f]:v}))}));

  const lookupGsis=async()=>{
    const afm=draft.cp.afm?.trim();
    if(!afm||afm.length<9){setGsis({status:"err",err:"Εισάγετε έγκυρο ΑΦΜ (9 ψηφία)",info:null});return;}
    setGsis({status:"loading",err:"",info:null});
    try{
      const res=await fetch("/.netlify/functions/gsis-lookup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({afm})});
      const json=await res.json();
      if(json.error){setGsis({status:"err",err:json.error,info:null});return;}
      const d=json.data;
      setGsis({status:"ok",err:"",info:d});
      setDraft(p=>({...p,cp:{...p.cp,name:d.name||p.cp.name,addr:d.address||p.cp.addr,city:d.city||p.cp.city,country:"GR"}}));
    }catch(e){setGsis({status:"err",err:"Σφάλμα σύνδεσης",info:null});}
  };

  const submitMyData=async()=>{

    try{

      const xml=buildXML(draft,cfg,num);
      const url=(cfg.sandbox?MYDATA_SANDBOX:MYDATA_PROD)+"/SendInvoices";
      const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/xml","aade-user-id":cfg.userId,"Ocp-Apim-Subscription-Key":cfg.subKey},body:xml});
      const txt=await res.text();
      const mark=txt.match(/<mark>(\d+)<\/mark>/)?.[1]||null;
      const invUid=txt.match(/<uid>([^<]+)<\/uid>/)?.[1]||null;
      if(res.ok&&mark){
        const saved={...draft,id:Date.now(),number:num,issueDate:draft.date,mark,invUid,totalNet,totalVat,totalGross,status:"sent",cpName:draft.cp.name};
        await addInv(saved);saveCfg({...cfg,nextNum:num+1});
        toast$(`Εστάλη επιτυχώς! MARK: ${mark}`,"ok");
        setDraft(emptyInv());go("invoices");
      }else{toast$(txt.match(/<message>([^<]+)<\/message>/)?.[1]||"Σφάλμα αποστολής","err");}
    }catch(e){toast$("Σφάλμα: "+e.message,"err");}
    finally{setLoad(false);}
  };

            <div style={col()}><label style={lbl}>Subscription Key</label><input style={{...inp,fontFamily:"monospace"}} type="password" value={lc.subKey} onChange={e=>setLc({...lc,subKey:e.target.value})}/></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:14}}>
            <input type="checkbox" id="sb" checked={lc.sandbox} onChange={e=>setLc({...lc,sandbox:e.target.checked})} style={{width:16,height:16,accentColor:C.blue}}/>
            <label htmlFor="sb" style={{fontSize:13,color:C.text2,cursor:"pointer"}}>Sandbox mode (δοκιμαστικό περιβάλλον)</label>
          </div>
        </div>

        <div style={card}>
          <h3 style={{fontSize:14,fontWeight:600,marginBottom:8}}>Αναζήτηση ΑΦΜ (ΓΓΠΣ)</h3>
          <div style={{padding:"10px 14px",background:C.greenL,borderRadius:8,fontSize:13,color:C.green}}>
            ✓ Ενεργό — Πληκτρολόγησε ΑΦΜ στο νέο παραστατικό και πάτα <strong>🔍 ΓΓΠΣ</strong> για αυτόματη συμπλήρωση.
          </div>
        </div>

        <div style={card}>
          <h3 style={{fontSize:14,fontWeight:600,marginBottom:16}}>Αρίθμηση</h3>
          <div style={row}>
            <div style={col(.5)}><label style={lbl}>Σειρά</label><input style={inp} value={lc.series} onChange={e=>setLc({...lc,series:e.target.value})}/></div>
            <div style={col(.5)}><label style={lbl}>Επόμενος Α/Α</label><input type="number" style={inp} value={lc.nextNum} onChange={e=>setLc({...lc,nextNum:Number(e.target.value)})}/></div>
          </div>
        </div>

        {sb&&user&&!user.demo&&(
          <div style={{...card,borderColor:"#a7f3d0"}}>
            <div style={{fontWeight:600,color:C.green,marginBottom:4}}>Cloud Sync ενεργό</div>
            <div style={{fontSize:13,color:C.muted}}>Συγχρονίζεται με Supabase — {user.email}</div>
          </div>
        )}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:40}}>
          {invoices.length>0&&<button style={{...btn("ghost",true),color:C.red}} onClick={()=>{if(confirm("Διαγραφή ΟΛΩΝ των παραστατικών;")){{setInvs([]);lsSet("myd_inv",[]);toast$("Διαγράφηκαν");} }}}>Εκκαθάριση δεδομένων</button>}
          <button style={btn("primary")} onClick={save}>Αποθήκευση</button>
        </div>
      </div>
    );
  };

  // ── RENDER ─────────────────────────────────────────────────────────────────────
  if(!authOk) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:C.muted,fontSize:14}}>Φόρτωση...</div>;
  if(!user)   return <AuthScreen onLogin={u=>setUser(u)}/>;

  return(
    <div style={{fontFamily:"'Inter',system-ui,sans-serif",background:C.bg,color:C.text,minHeight:"100vh",fontSize:14}}>
      {/* Mobile hamburger */}
      {isMob&&<button style={{position:"fixed",top:14,left:14,zIndex:200,background:C.white,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",cursor:"pointer",fontSize:18,color:C.text,lineHeight:1,boxShadow:"0 1px 4px rgba(0,0,0,.1)"}} onClick={()=>setMob(!mob)}>☰</button>}
      {isMob&&mob&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.3)",zIndex:99,backdropFilter:"blur(2px)"}} onClick={()=>setMob(false)}/>}

      {/* Sidebar */}
      {(!isMob||mob)&&<Sidebar/>}

      {/* Main */}
      <div style={isMob?{padding:"16px 14px",paddingTop:60}:{marginLeft:SIDEBAR_W,padding:"36px 40px",maxWidth:SIDEBAR_W+960}}>
        {page==="dashboard"&&<Dashboard/>}
        {page==="new"&&<NewInvoice/>}
        {page==="invoices"&&<InvList/>}
        {page==="settings"&&<Settings/>}
      </div>

      {/* Toast */}
      {toast&&(
        <div style={{position:"fixed",bottom:24,right:24,zIndex:9999,padding:"12px 20px",borderRadius:10,fontSize:13,fontWeight:500,
          boxShadow:"0 4px 16px rgba(0,0,0,.12)",
          background:toast.type==="ok"?C.greenL:C.redL,
          border:`1px solid ${toast.type==="ok"?"#a7f3d0":"#fca5a5"}`,
          color:toast.type==="ok"?C.green:C.red,
        }}>{toast.msg}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
