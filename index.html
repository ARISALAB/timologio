<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myDATA·app</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f8f9fa;color:#111827;font-size:14px}
input,select,textarea{font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2563eb!important;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:10px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

// ── Config ────────────────────────────────────────────────────────────────────
const SUPABASE_URL = "";
const SUPABASE_KEY = "";
const sb = (SUPABASE_URL && SUPABASE_KEY) ? supabase.createClient(SUPABASE_URL,SUPABASE_KEY) : null;
const SANDBOX_URL = "https://mydataapidev.aade.gr/AADE-Public-api-myDATA-v1_0_8";
const PROD_URL    = "https://mydataapi.aade.gr/AADE-Public-api-myDATA-v1_0_8";

// ── Data ──────────────────────────────────────────────────────────────────────
const INV_TYPES = [
  {v:"1.1",l:"1.1 — Τιμολόγιο Πώλησης"},
  {v:"2.1",l:"2.1 — Τιμολόγιο Παροχής Υπηρεσιών"},
  {v:"11.1",l:"11.1 — ΑΠΥ"},
  {v:"11.2",l:"11.2 — ΑΛΠ"},
];
const VAT_CATS = [
  {v:1,l:"24%",r:.24},{v:2,l:"13%",r:.13},{v:3,l:"6%",r:.06},{v:4,l:"0%",r:0},
];
const PMETHODS = [
  {v:1,l:"Επαγγελματικός Λογαριασμός"},{v:3,l:"Μετρητά"},{v:4,l:"Επιταγή"},
  {v:5,l:"Πίστωση"},{v:6,l:"Κάρτα / Web Banking"},{v:7,l:"IRIS"},
];

// ── Helpers ───────────────────────────────────────────────────────────────────
const fmt = n => Number(n||0).toLocaleString("el-GR",{minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().split("T")[0];
const uid = () => Math.random().toString(36).slice(2);
const calcLine = l => { const r=VAT_CATS.find(v=>v.v===l.vatCat)?.r||0; const net=l.qty*l.price; return {...l,net,vat:net*r}; };
const lsGet = (k,d) => { try{const s=localStorage.getItem(k);return s?JSON.parse(s):d}catch{return d} };
const lsSet = (k,v) => { try{localStorage.setItem(k,JSON.stringify(v))}catch{} };
const emptyLine = () => ({id:uid(),desc:"",qty:1,price:0,vatCat:1,net:0,vat:0});
const emptyInv = (cfg) => ({
  type:"2.1", series:cfg?.series||"Α", date:today(),
  cp:{name:"",afm:"",addr:"",city:"",country:"GR"},
  pm:3, lines:[emptyLine()], notes:"",
});

// ── Colors ────────────────────────────────────────────────────────────────────
const C = {
  bg:"#f8f9fa", white:"#fff", border:"#e5e7eb",
  text:"#111827", text2:"#374151", muted:"#6b7280",
  blue:"#2563eb", blueL:"#eff6ff",
  green:"#059669", greenL:"#ecfdf5",
  orange:"#d97706", orangeL:"#fffbeb",
  red:"#dc2626", redL:"#fef2f2",
};

// ── Shared styles ─────────────────────────────────────────────────────────────
const inp = {width:"100%",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",color:C.text,background:C.white,fontSize:14,outline:"none",boxSizing:"border-box"};
const lbl = {fontSize:13,fontWeight:500,color:C.text2,marginBottom:6,display:"block"};
const card = {background:C.white,border:`1px solid ${C.border}`,borderRadius:12,padding:24,marginBottom:16};
const row = {display:"flex",gap:16,flexWrap:"wrap"};
const col = (f=1) => ({flex:f,minWidth:160});
const th = {textAlign:"left",padding:"10px 16px",fontSize:11,fontWeight:600,color:C.muted,borderBottom:`1px solid ${C.border}`,textTransform:"uppercase",letterSpacing:.6,background:"#f9fafb"};
const td = {padding:"13px 16px",fontSize:14,borderBottom:`1px solid ${C.border}`,color:C.text,verticalAlign:"middle"};

const Btn = ({v="primary",sm,onClick,disabled,children,style}) => (
  <button onClick={onClick} disabled={disabled} style={{
    padding:sm?"6px 14px":"10px 18px", borderRadius:8, border:"none",
    cursor:disabled?"not-allowed":"pointer", fontSize:sm?13:14, fontWeight:500,
    opacity:disabled?.6:1,
    background:v==="primary"?C.blue:v==="danger"?C.red:v==="ghost"?"transparent":C.white,
    color:v==="primary"||v==="danger"?"#fff":v==="ghost"?C.muted:C.text2,
    border:v==="secondary"?`1px solid ${C.border}`:"none",
    boxShadow:v==="secondary"?"0 1px 2px rgba(0,0,0,.05)":"none",
    ...style
  }}>{children}</button>
);

const Badge = ({type,children}) => (
  <span style={{display:"inline-block",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:500,
    background:type==="sent"?C.greenL:C.orangeL,
    color:type==="sent"?C.green:C.orange}}>{children}</span>
);

// ── XML builder ───────────────────────────────────────────────────────────────
function buildXML(inv,issuerAfm,num){
  const net=inv.lines.reduce((s,l)=>s+l.net,0);
  const vat=inv.lines.reduce((s,l)=>s+l.vat,0);
  const gross=net+vat;
  const lines=inv.lines.map((l,i)=>`
    <invoiceDetails><lineNumber>${i+1}</lineNumber>
      <netValue>${l.net.toFixed(2)}</netValue>
      <vatCategory>${l.vatCat}</vatCategory>
      <vatAmount>${l.vat.toFixed(2)}</vatAmount>
    </invoiceDetails>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>
<RequestDoc><InvoicesDoc><invoice>
  <issuer><vatNumber>${issuerAfm}</vatNumber><country>GR</country><branch>0</branch></issuer>
  ${inv.cp.afm?`<counterpart><vatNumber>${inv.cp.afm}</vatNumber><country>GR</country><branch>0</branch></counterpart>`:""}
  <invoiceHeader>
    <series>${inv.series}</series><aa>${num}</aa>
    <issueDate>${inv.date}</issueDate>
    <invoiceType>${inv.type}</invoiceType>
    <currency>EUR</currency>
  </invoiceHeader>
  <paymentMethods><paymentMethodDetails>
    <type>${inv.pm}</type><amount>${gross.toFixed(2)}</amount>
  </paymentMethodDetails></paymentMethods>
  ${lines}
  <invoiceSummary>
    <totalNetValue>${net.toFixed(2)}</totalNetValue>
    <totalVatAmount>${vat.toFixed(2)}</totalVatAmount>
    <totalWithheldAmount>0.00</totalWithheldAmount><totalFeesAmount>0.00</totalFeesAmount>
    <totalStampDutyAmount>0.00</totalStampDutyAmount><totalOtherTaxesAmount>0.00</totalOtherTaxesAmount>
    <totalDeductionsAmount>0.00</totalDeductionsAmount>
    <totalGrossValue>${gross.toFixed(2)}</totalGrossValue>
    <incomeClassification>
      <classificationType>E3_561_001</classificationType>
      <classificationCategory>category1_1</classificationCategory>
      <amount>${net.toFixed(2)}</amount>
    </incomeClassification>
  </invoiceSummary>
</invoice></InvoicesDoc></RequestDoc>`;
}

// ── PDF ───────────────────────────────────────────────────────────────────────
function makePDF(inv,cfg){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210;
  const net=inv.lines.reduce((s,l)=>s+l.net,0);
  const vat=inv.lines.reduce((s,l)=>s+l.vat,0);
  const gross=net+vat;
  const typeL=INV_TYPES.find(t=>t.v===inv.type)?.l||inv.type;

  doc.setFillColor(255,255,255);doc.rect(0,0,W,38,"F");
  doc.setDrawColor(229,231,235);doc.setLineWidth(.3);doc.line(0,38,W,38);
  doc.setFontSize(16);doc.setFont("helvetica","bold");doc.setTextColor(17,24,39);
  doc.text("myDATA",14,15);
  doc.setTextColor(37,99,235);doc.text("·app",14+doc.getTextWidth("myDATA"),15);
  doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(107,114,128);
  doc.text("Τιμολόγηση & myDATA",14,21);
  doc.setFontSize(11);doc.setFont("helvetica","bold");doc.setTextColor(17,24,39);
  doc.text(typeL,W-14,15,{align:"right"});
  doc.setFontSize(10);doc.setTextColor(37,99,235);
  doc.text(`${inv.series}${inv.number||""}`,W-14,21,{align:"right"});
  doc.setFontSize(8);doc.setFont("helvetica","normal");doc.setTextColor(107,114,128);
  doc.text(inv.date,W-14,26,{align:"right"});
  if(inv.mark){doc.setTextColor(5,150,105);doc.text(`MARK: ${inv.mark}`,W-14,31,{align:"right"});}

  let y=46; const cW=(W-30)/2;
  [[14,"ΕΚΔΟΤΗΣ",[cfg.name||"—",cfg.addr||"",`ΑΦΜ: ${cfg.afm||"—"}`]],
   [14+cW+2,"ΑΝΤΙΣΥΜΒΑΛΛΟΜΕΝΟΣ",[inv.cp.name||"—",inv.cp.addr||"",inv.cp.afm?`ΑΦΜ: ${inv.cp.afm}`:"",inv.cp.city||""]]
  ].forEach(([x,title,rows])=>{
    doc.setFillColor(249,250,251);doc.roundedRect(x,y,cW,28,2,2,"F");
    doc.setDrawColor(229,231,235);doc.setLineWidth(.2);doc.roundedRect(x,y,cW,28,2,2,"S");
    doc.setFontSize(7);doc.setFont("helvetica","bold");doc.setTextColor(107,114,128);doc.text(title,x+4,y+6);
    let ly=y+13;
    rows.forEach((r,i)=>{if(!r)return;doc.setFont("helvetica",i===0?"bold":"normal");doc.setFontSize(i===0?9:8);doc.setTextColor(i===0?[17,24,39]:[107,114,128]);doc.text(r,x+4,ly);ly+=5;});
  });
  y+=34;

  doc.autoTable({
    startY:y,
    head:[["Περιγραφή","Ποσ.","Τιμή","ΦΠΑ","Καθαρό","ΦΠΑ €","Σύνολο"]],
    body:inv.lines.map(l=>[l.desc||"—",l.qty,`€${fmt(l.price)}`,VAT_CATS.find(v=>v.v===l.vatCat)?.l||"",`€${fmt(l.net)}`,`€${fmt(l.vat)}`,`€${fmt(l.net+l.vat)}`]),
    styles:{fontSize:8,cellPadding:3,textColor:[17,24,39],fillColor:[255,255,255],lineColor:[229,231,235],lineWidth:.2},
    headStyles:{fillColor:[249,250,251],textColor:[107,114,128],fontStyle:"bold",fontSize:7},
    alternateRowStyles:{fillColor:[249,250,251]},
    columnStyles:{0:{cellWidth:55},1:{cellWidth:12,halign:"center"},2:{cellWidth:22,halign:"right"},3:{cellWidth:16,halign:"center"},4:{cellWidth:26,halign:"right"},5:{cellWidth:20,halign:"right"},6:{cellWidth:25,halign:"right"}},
    margin:{left:14,right:14},
  });

  y=doc.lastAutoTable.finalY+8;
  const tx=W-14-68;
  doc.setFillColor(249,250,251);doc.roundedRect(tx,y,68,34,2,2,"F");
  [[`Καθαρή αξία:`,`€${fmt(net)}`],[`ΦΠΑ:`,`€${fmt(vat)}`],[`Σύνολο:`,`€${fmt(gross)}`]].forEach(([l,v],i)=>{
    const ty=y+9+i*9;
    doc.setFontSize(i===2?10:8.5);doc.setFont("helvetica",i===2?"bold":"normal");
    doc.setTextColor(i===2?[37,99,235]:[107,114,128]);doc.text(l,tx+4,ty);
    doc.setTextColor(i===2?[37,99,235]:[17,24,39]);doc.text(v,tx+64,ty,{align:"right"});
  });
  doc.setFontSize(7);doc.setFont("helvetica","normal");doc.setTextColor(107,114,128);
  doc.line(14,283,W-14,283);
  doc.text("myDATA·app",W/2,289,{align:"center"});
  doc.save(`${inv.series}${inv.number||"draft"}_${inv.date}.pdf`);
}

// ═════════════════════════════════════════════════════════════════════════════
// INVOICE FORM — ξεχωριστό top-level component για να μην χάνεται το focus
// ═════════════════════════════════════════════════════════════════════════════
function InvoiceForm({cfg, onSave, onSubmit, loading, gsisStatus, gsisInfo, gsisErr, onGsisLookup}){
  const [inv, setInv] = useState(() => emptyInv(cfg));

  // Όταν το ΓΓΠΣ γυρίσει αποτέλεσμα, συμπλήρωσε τα πεδία
  useEffect(() => {
    if(gsisStatus === "ok" && gsisInfo){
      setInv(p => ({...p, cp:{...p.cp,
        name: gsisInfo.name || p.cp.name,
        addr: gsisInfo.address || p.cp.addr,
        city: gsisInfo.city || p.cp.city,
      }}));
    }
  }, [gsisStatus, gsisInfo]);

  const updLine = useCallback((i,f,v) => {
    setInv(p => ({...p, lines: p.lines.map((l,j) => j!==i ? l : calcLine({...l,[f]:v}))}));
  }, []);

  const addLine = useCallback(() => {
    setInv(p => ({...p, lines:[...p.lines, emptyLine()]}));
  }, []);

  const removeLine = useCallback((i) => {
    setInv(p => ({...p, lines: p.lines.filter((_,j) => j!==i)}));
  }, []);

  const totalNet   = inv.lines.reduce((s,l)=>s+l.net,0);
  const totalVat   = inv.lines.reduce((s,l)=>s+l.vat,0);
  const totalGross = totalNet+totalVat;

  return (
    <div>
      <div style={{marginBottom:24}}>
        <h1 style={{fontSize:24,fontWeight:700}}>Νέο Παραστατικό</h1>
      </div>

      {/* Στοιχεία */}
      <div style={card}>
        <h3 style={{fontSize:14,fontWeight:600,marginBottom:16}}>Στοιχεία Παραστατικού</h3>
        <div style={row}>
          <div style={col(2)}>
            <label style={lbl}>Τύπος</label>
            <select style={inp} value={inv.type} onChange={e=>setInv(p=>({...p,type:e.target.value}))}>
              {INV_TYPES.map(t=><option key={t.v} value={t.v}>{t.l}</option>)}
            </select>
          </div>
          <div style={col(.5)}>
            <label style={lbl}>Σειρά</label>
            <input style={inp} value={inv.series} onChange={e=>setInv(p=>({...p,series:e.target.value}))}/>
          </div>
          <div style={col(.5)}>
            <label style={lbl}>Α/Α</label>
            <input style={{...inp,background:"#f9fafb",color:C.muted}} value={cfg.nextNum} readOnly/>
          </div>
          <div style={col(.8)}>
            <label style={lbl}>Ημερομηνία</label>
            <input type="date" style={inp} value={inv.date} onChange={e=>setInv(p=>({...p,date:e.target.value}))}/>
          </div>
        </div>
      </div>

      {/* Αντισυμβαλλόμενος */}
      <div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h3 style={{fontSize:14,fontWeight:600}}>Αντισυμβαλλόμενος</h3>
          {gsisStatus==="ok"  && <span style={{fontSize:12,color:C.green,fontWeight:500}}>✓ Στοιχεία από ΓΓΠΣ</span>}
          {gsisStatus==="err" && <span style={{fontSize:12,color:C.red}}>{gsisErr}</span>}
          {gsisStatus==="loading" && <span style={{fontSize:12,color:C.muted}}>Αναζήτηση...</span>}
        </div>
        <div style={row}>
          <div style={col(2)}>
            <label style={lbl}>Επωνυμία / Ονοματεπώνυμο</label>
            <input style={inp} placeholder="π.χ. Ιωάννης Παπαδόπουλος"
              value={inv.cp.name}
              onChange={e=>setInv(p=>({...p,cp:{...p.cp,name:e.target.value}}))}/>
          </div>
          <div style={col()}>
            <label style={lbl}>ΑΦΜ</label>
            <div style={{display:"flex",gap:8}}>
              <input style={{...inp,flex:1}} placeholder="123456789"
                value={inv.cp.afm}
                onChange={e=>setInv(p=>({...p,cp:{...p.cp,afm:e.target.value}}))}
                onKeyDown={e=>e.key==="Enter"&&onGsisLookup(inv.cp.afm)}/>
              <Btn v="secondary" onClick={()=>onGsisLookup(inv.cp.afm)} disabled={gsisStatus==="loading"} style={{whiteSpace:"nowrap"}}>
                {gsisStatus==="loading"?"...":"🔍 ΓΓΠΣ"}
              </Btn>
            </div>
          </div>
          <div style={col(.5)}>
            <label style={lbl}>Χώρα</label>
            <input style={inp} value={inv.cp.country}
              onChange={e=>setInv(p=>({...p,cp:{...p.cp,country:e.target.value}}))}/>
          </div>
        </div>
        {gsisInfo && (
          <div style={{marginTop:12,padding:"10px 14px",background:C.greenL,border:`1px solid #a7f3d0`,borderRadius:8,fontSize:13,color:C.green}}>
            <strong>{gsisInfo.name}</strong>
            {gsisInfo.doy&&<span style={{color:C.muted}}> · ΔΟΥ: {gsisInfo.doy}</span>}
            {gsisInfo.deactivated&&<span style={{color:C.red,marginLeft:8}}>⚠ Ανενεργό ΑΦΜ</span>}
          </div>
        )}
        <div style={{...row,marginTop:16}}>
          <div style={col(2)}>
            <label style={lbl}>Διεύθυνση</label>
            <input style={inp} placeholder="Οδός, Αριθμός"
              value={inv.cp.addr}
              onChange={e=>setInv(p=>({...p,cp:{...p.cp,addr:e.target.value}}))}/>
          </div>
          <div style={col()}>
            <label style={lbl}>Πόλη</label>
            <input style={inp} value={inv.cp.city}
              onChange={e=>setInv(p=>({...p,cp:{...p.cp,city:e.target.value}}))}/>
          </div>
          <div style={col()}>
            <label style={lbl}>Τρόπος Πληρωμής</label>
            <select style={inp} value={inv.pm} onChange={e=>setInv(p=>({...p,pm:Number(e.target.value)}))}>
              {PMETHODS.map(p=><option key={p.v} value={p.v}>{p.l}</option>)}
            </select>
          </div>
        </div>
      </div>

      {/* Γραμμές */}
      <div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <h3 style={{fontSize:14,fontWeight:600}}>Γραμμές</h3>
          <Btn v="secondary" sm onClick={addLine}>+ Γραμμή</Btn>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:680}}>
            <thead>
              <tr>{["Περιγραφή","Ποσ.","Τιμή μον.","ΦΠΑ","Καθαρό","ΦΠΑ €",""].map(h=><th key={h} style={th}>{h}</th>)}</tr>
            </thead>
            <tbody>
              {inv.lines.map((l,i)=>(
                <tr key={l.id}>
                  <td style={td}><input style={{...inp,minWidth:180}} placeholder="Περιγραφή" value={l.desc} onChange={e=>updLine(i,"desc",e.target.value)}/></td>
                  <td style={td}><input type="number" style={{...inp,width:65}} value={l.qty} onChange={e=>updLine(i,"qty",Number(e.target.value))}/></td>
                  <td style={td}><input type="number" style={{...inp,width:95}} value={l.price} onChange={e=>updLine(i,"price",Number(e.target.value))}/></td>
                  <td style={td}>
                    <select style={{...inp,width:90}} value={l.vatCat} onChange={e=>updLine(i,"vatCat",Number(e.target.value))}>
                      {VAT_CATS.map(v=><option key={v.v} value={v.v}>{v.l}</option>)}
                    </select>
                  </td>
                  <td style={{...td,fontWeight:600,color:C.blue}}>€{fmt(l.net)}</td>
                  <td style={{...td,color:C.muted}}>€{fmt(l.vat)}</td>
                  <td style={td}>{inv.lines.length>1&&<button onClick={()=>removeLine(i)} style={{background:"none",border:"none",color:"#9ca3af",cursor:"pointer",fontSize:18,lineHeight:1,padding:4}}>×</button>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <div style={{borderTop:`1px solid ${C.border}`,marginTop:16,paddingTop:16,display:"flex",justifyContent:"flex-end"}}>
          <div style={{minWidth:220}}>
            {[["Καθαρή αξία",`€${fmt(totalNet)}`],["ΦΠΑ",`€${fmt(totalVat)}`]].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                <span style={{color:C.muted}}>{l}</span><span style={{fontWeight:500}}>{v}</span>
              </div>
            ))}
            <div style={{borderTop:`2px solid ${C.border}`,paddingTop:10,display:"flex",justifyContent:"space-between"}}>
              <span style={{fontWeight:600}}>Σύνολο</span>
              <span style={{fontWeight:700,fontSize:20,color:C.blue}}>€{fmt(totalGross)}</span>
            </div>
          </div>
        </div>
      </div>

      {/* Παρατηρήσεις */}
      <div style={card}>
        <label style={lbl}>Παρατηρήσεις <span style={{color:"#9ca3af",fontWeight:400}}>(προαιρετικά)</span></label>
        <textarea style={{...inp,height:72,resize:"vertical"}} placeholder="π.χ. Εξόφληση εντός 30 ημερών"
          value={inv.notes} onChange={e=>setInv(p=>({...p,notes:e.target.value}))}/>
      </div>

      <div style={{display:"flex",gap:12,justifyContent:"flex-end",paddingBottom:40}}>
        <Btn v="secondary" onClick={()=>onSave(inv,totalNet,totalVat,totalGross)}>Αποθήκευση ως πρόχειρο</Btn>
        <Btn v="primary" onClick={()=>onSubmit(inv,totalNet,totalVat,totalGross)} disabled={loading} style={{minWidth:200}}>
          {loading?"Αποστολή...":"Αποστολή στο myDATA →"}
        </Btn>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════════════
// AUTH
// ═════════════════════════════════════════════════════════════════════════════
function AuthScreen({onLogin}){
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [msg,setMsg]=useState("");

  const submit=async()=>{
    if(!sb){onLogin({id:"demo",email:"demo@local",demo:true});return;}
    setLoading(true);setErr("");
    try{
      let r;
      if(mode==="login") r=await sb.auth.signInWithPassword({email,password:pass});
      else if(mode==="reg"){r=await sb.auth.signUp({email,password:pass});if(!r.error){setMsg("Έλεγξε το email σου!");return;}}
      else{r=await sb.auth.resetPasswordForEmail(email);if(!r.error){setMsg("Στάλθηκε email!");return;}}
      if(r.error){setErr(r.error.message);return;}
      if(r.data?.user) onLogin(r.data.user);
    }finally{setLoading(false);}
  };

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{...card,width:400,maxWidth:"100%",boxShadow:"0 4px 24px rgba(0,0,0,.06)",marginBottom:0}}>
        <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>myDATA<span style={{color:C.blue}}>·app</span></div>
        <div style={{color:C.muted,fontSize:14,marginBottom:24}}>Τιμολόγηση & myDATA</div>
        {!sb&&<div style={{padding:"10px 14px",background:C.orangeL,border:`1px solid #fde68a`,borderRadius:8,fontSize:12,color:C.orange,marginBottom:20}}>Demo mode — αποθήκευση τοπικά</div>}
        <div style={{display:"flex",gap:4,marginBottom:20,background:"#f3f4f6",borderRadius:8,padding:4}}>
          {[["login","Σύνδεση"],["reg","Εγγραφή"]].map(([m,l])=>(
            <button key={m} onClick={()=>{setMode(m);setErr("");setMsg("");}} style={{flex:1,padding:"8px",borderRadius:6,border:"none",cursor:"pointer",fontSize:13,fontWeight:500,background:mode===m?C.white:"transparent",color:mode===m?C.text:C.muted,boxShadow:mode===m?"0 1px 3px rgba(0,0,0,.1)":"none"}}>{l}</button>
          ))}
        </div>
        {msg?<div style={{padding:14,background:C.greenL,border:`1px solid #a7f3d0`,borderRadius:8,color:C.green,fontSize:13}}>{msg}</div>:<>
          <div style={{marginBottom:14}}><label style={lbl}>Email</label><input style={inp} type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
          {mode!=="forgot"&&<div style={{marginBottom:20}}><label style={lbl}>Κωδικός</label><input style={inp} type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>}
          {err&&<div style={{color:C.red,fontSize:12,marginBottom:12,padding:"8px 12px",background:C.redL,borderRadius:6}}>{err}</div>}
          <Btn v="primary" onClick={submit} disabled={loading} style={{width:"100%",justifyContent:"center"}}>
            {loading?"Φόρτωση...":mode==="login"?"Σύνδεση →":mode==="reg"?"Δημιουργία λογαριασμού":"Αποστολή email"}
          </Btn>
          {mode==="login"&&<div style={{textAlign:"center",marginTop:12}}><span style={{color:C.blue,fontSize:13,cursor:"pointer"}} onClick={()=>setMode("forgot")}>Ξέχασες τον κωδικό;</span></div>}
        </>}
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ═════════════════════════════════════════════════════════════════════════════
function App(){
  const [user,setUser]     = useState(null);
  const [authOk,setAuthOk] = useState(false);
  const [page,setPage]     = useState("dashboard");
  const [cfg,setCfgRaw]    = useState(()=>lsGet("myd_cfg",{name:"",afm:"",addr:"",nextNum:1,series:"Α"}));
  const [invoices,setInvs] = useState(()=>lsGet("myd_inv",[]));
  const [toast,setToast]   = useState(null);
  const [loading,setLoad]  = useState(false);
  const [mob,setMob]       = useState(false);
  const [isMob,setIsMob]   = useState(window.innerWidth<768);
  const [gsis,setGsis]     = useState({status:null,err:"",info:null});

  useEffect(()=>{
    const fn=()=>setIsMob(window.innerWidth<768);
    window.addEventListener("resize",fn);
    return()=>window.removeEventListener("resize",fn);
  },[]);

  useEffect(()=>{
    if(!sb){setAuthOk(true);return;}
    sb.auth.getSession().then(({data:{session}})=>{if(session?.user)setUser(session.user);setAuthOk(true);});
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setUser(s?.user||null));
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!sb||!user||user.demo)return;
    sb.from("user_settings").select("settings").eq("user_id",user.id).single().then(({data})=>{if(data?.settings){setCfgRaw(data.settings);lsSet("myd_cfg",data.settings);}});
    sb.from("invoices").select("payload").eq("user_id",user.id).order("created_at",{ascending:false}).then(({data})=>{if(data?.length){const a=data.map(d=>d.payload);setInvs(a);lsSet("myd_inv",a);}});
  },[user]);

  const saveCfg = useCallback((val)=>{
    setCfgRaw(val);lsSet("myd_cfg",val);
    if(sb&&user&&!user.demo) sb.from("user_settings").upsert({user_id:user.id,settings:val},{onConflict:"user_id"});
  },[user]);

  const addInv = useCallback(async(inv)=>{
    const a=[inv,...invoices];setInvs(a);lsSet("myd_inv",a);
    if(sb&&user&&!user.demo) await sb.from("invoices").insert({user_id:user.id,series:inv.series,number:inv.number,issue_date:inv.date,invoice_type:inv.type,counterpart_name:inv.cp?.name,counterpart_vat:inv.cp?.afm,total_net:inv.totalNet,total_vat:inv.totalVat,total_gross:inv.totalGross,status:inv.status,mark:inv.mark,payload:inv});
  },[invoices,user]);

  const toast$ = (msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),3800);};
  const go = (pg)=>{setPage(pg);setMob(false);if(pg==="new")setGsis({status:null,err:"",info:null});};
  const signOut = async()=>{if(sb)await sb.auth.signOut();setUser(null);};

  const lookupGsis = useCallback(async(afm)=>{
    const a=(afm||"").trim();
    if(!a||a.length<9){setGsis({status:"err",err:"Εισάγετε έγκυρο ΑΦΜ (9 ψηφία)",info:null});return;}
    setGsis({status:"loading",err:"",info:null});
    try{
      const res=await fetch("/.netlify/functions/gsis-lookup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({afm:a})});
      const json=await res.json();
      if(json.error){setGsis({status:"err",err:json.error,info:null});return;}
      setGsis({status:"ok",err:"",info:json.data});
    }catch(e){setGsis({status:"err",err:"Σφάλμα σύνδεσης",info:null});}
  },[]);

  const submitMyData = useCallback(async(inv,totalNet,totalVat,totalGross)=>{
    if(!cfg.afm){toast$("Συμπλήρωσε το ΑΦΜ σου στις Ρυθμίσεις","err");return;}
    setLoad(true);
    try{
      const num=cfg.nextNum;
      const xml=buildXML(inv,cfg.afm,num);
      const res=await fetch("/.netlify/functions/mydata-send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({xml})});
      const json=await res.json();
      if(json.error){toast$(json.error,"err");return;}
      if(json.mark){
        const saved={...inv,id:Date.now(),number:num,issueDate:inv.date,mark:json.mark,invUid:json.uid,totalNet,totalVat,totalGross,status:"sent",cpName:inv.cp.name};
        await addInv(saved);saveCfg({...cfg,nextNum:num+1});
        toast$(`Εστάλη! MARK: ${json.mark}`,"ok");go("invoices");
      }else{toast$(json.error||"Σφάλμα αποστολής","err");}
    }catch(e){toast$("Σφάλμα: "+e.message,"err");}
    finally{setLoad(false);}
  },[cfg,addInv,saveCfg]);

  const saveDraft = useCallback(async(inv,totalNet,totalVat,totalGross)=>{
    const saved={...inv,id:Date.now(),number:cfg.nextNum,issueDate:inv.date,totalNet,totalVat,totalGross,status:"draft",cpName:inv.cp.name};
    await addInv(saved);toast$("Αποθηκεύτηκε ως πρόχειρο","ok");go("invoices");
  },[cfg,addInv]);

  // KPIs
  const month=invoices.filter(i=>i.status==="sent"&&(i.date||i.issueDate||"").startsWith(today().slice(0,7)));
  const kN=month.reduce((s,i)=>s+(i.totalNet||0),0);
  const kV=month.reduce((s,i)=>s+(i.totalVat||0),0);
  const kG=month.reduce((s,i)=>s+(i.totalGross||0),0);

  const NAV=[{id:"dashboard",ic:"⊞",lb:"Dashboard"},{id:"new",ic:"+",lb:"Νέο Παραστατικό"},{id:"invoices",ic:"≡",lb:"Παραστατικά"},{id:"settings",ic:"⚙",lb:"Ρυθμίσεις"}];
  const SW=240;

  if(!authOk) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:C.muted}}>Φόρτωση...</div>;
  if(!user)   return <AuthScreen onLogin={u=>setUser(u)}/>;

  return(
    <div style={{fontFamily:"'Inter',system-ui,sans-serif",background:C.bg,color:C.text,minHeight:"100vh"}}>

      {/* Hamburger */}
      {isMob&&<button onClick={()=>setMob(!mob)} style={{position:"fixed",top:14,left:14,zIndex:200,background:C.white,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 10px",cursor:"pointer",fontSize:18,lineHeight:1}}>☰</button>}
      {isMob&&mob&&<div onClick={()=>setMob(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.3)",zIndex:99}}/>}

      {/* Sidebar */}
      {(!isMob||mob)&&(
        <div style={{position:"fixed",top:0,left:0,width:SW,height:"100vh",background:C.white,borderRight:`1px solid ${C.border}`,display:"flex",flexDirection:"column",zIndex:100}}>
          <div style={{padding:"24px 20px 20px",borderBottom:`1px solid ${C.border}`}}>
            <div style={{fontSize:18,fontWeight:700}}>myDATA<span style={{color:C.blue}}>·app</span></div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>Τιμολόγηση & myDATA</div>
          </div>
          <nav style={{flex:1,padding:"12px 10px"}}>
            {NAV.map(n=>(
              <div key={n.id} onClick={()=>go(n.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",marginBottom:2,borderRadius:8,cursor:"pointer",userSelect:"none",background:page===n.id?C.blueL:"transparent",color:page===n.id?"#1d4ed8":C.text2,fontWeight:page===n.id?600:400,fontSize:14}}>
                <span style={{fontSize:16,width:20,textAlign:"center"}}>{n.ic}</span>{n.lb}
              </div>
            ))}
          </nav>
          <div style={{padding:"16px 20px",borderTop:`1px solid ${C.border}`,fontSize:12,color:C.muted}}>
            {cfg.afm&&<div style={{marginBottom:4}}>ΑΦΜ: {cfg.afm}</div>}
            {user&&!user.demo&&<div style={{marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.email}</div>}
            <button onClick={signOut} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:12,padding:0}}>Αποσύνδεση</button>
          </div>
        </div>
      )}

      {/* Main */}
      <div style={isMob?{padding:"16px 14px",paddingTop:60}:{marginLeft:SW,padding:"36px 40px",maxWidth:SW+960}}>

        {/* DASHBOARD */}
        {page==="dashboard"&&(
          <div>
            <div style={{marginBottom:28}}>
              <h1 style={{fontSize:24,fontWeight:700,marginBottom:4}}>Dashboard</h1>
              <p style={{color:C.muted}}>{new Date().toLocaleDateString("el-GR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:14,marginBottom:28}}>
              {[["Έσοδα μήνα",`€${fmt(kN)}`,C.blue],["ΦΠΑ μήνα",`€${fmt(kV)}`,C.orange],["Σύνολο μήνα",`€${fmt(kG)}`,C.green],["Παραστατικά",month.length,C.text]].map(([l,v,c])=>(
                <div key={l} style={{...card,marginBottom:0}}>
                  <div style={{fontSize:12,fontWeight:500,color:C.muted,marginBottom:8}}>{l}</div>
                  <div style={{fontSize:26,fontWeight:700,color:c}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={card}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
                <h2 style={{fontSize:16,fontWeight:600}}>Τελευταία παραστατικά</h2>
                {invoices.length>0&&<Btn v="secondary" sm onClick={()=>go("invoices")}>Όλα →</Btn>}
              </div>
              {invoices.length===0?(
                <div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>
                  <div style={{fontSize:36,marginBottom:12}}>📄</div>
                  <div style={{fontWeight:500,marginBottom:16}}>Δεν υπάρχουν παραστατικά ακόμα</div>
                  <Btn v="primary" onClick={()=>go("new")}>+ Νέο Παραστατικό</Btn>
                </div>
              ):(
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse"}}>
                    <thead><tr>{["Αρ.","Αντισυμβαλλόμενος","Ημερομηνία","Σύνολο","Κατάσταση",""].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
                    <tbody>
                      {invoices.slice(0,8).map(inv=>(
                        <tr key={inv.id} onMouseEnter={e=>e.currentTarget.style.background="#f9fafb"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                          <td style={{...td,color:C.blue,fontWeight:600,fontFamily:"monospace"}}>{inv.series}{inv.number}</td>
                          <td style={{...td,fontWeight:500}}>{inv.cpName||"—"}</td>
                          <td style={{...td,color:C.muted}}>{inv.date||inv.issueDate}</td>
                          <td style={{...td,fontWeight:600}}>€{fmt(inv.totalGross||0)}</td>
                          <td style={td}><Badge type={inv.status==="sent"?"sent":"draft"}>{inv.status==="sent"?"✓ myDATA":"Πρόχειρο"}</Badge></td>
                          <td style={td}><Btn v="secondary" sm onClick={()=>makePDF(inv,cfg)}>PDF</Btn></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
            {!cfg.afm&&<div style={{...card,borderColor:"#fde68a",background:C.orangeL}}>
              <div style={{fontWeight:600,color:C.orange,marginBottom:6}}>Απαιτείται ρύθμιση</div>
              <div style={{color:C.text2,fontSize:13,marginBottom:14}}>Συμπλήρωσε το ΑΦΜ σου στις Ρυθμίσεις.</div>
              <Btn v="primary" onClick={()=>go("settings")}>Ρυθμίσεις →</Btn>
            </div>}
          </div>
        )}

        {/* NEW INVOICE */}
        {page==="new"&&(
          <InvoiceForm
            cfg={cfg}
            loading={loading}
            gsisStatus={gsis.status}
            gsisInfo={gsis.info}
            gsisErr={gsis.err}
            onGsisLookup={lookupGsis}
            onSave={saveDraft}
            onSubmit={submitMyData}
          />
        )}

        {/* INVOICES */}
        {page==="invoices"&&(()=>{
          const [flt,setFlt]=useState("all");
          const list=flt==="all"?invoices:invoices.filter(i=>i.status===flt);
          return(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
                <h1 style={{fontSize:24,fontWeight:700}}>Παραστατικά</h1>
                <Btn v="primary" onClick={()=>go("new")}>+ Νέο</Btn>
              </div>
              <div style={{display:"flex",gap:4,marginBottom:16}}>
                {[["all","Όλα"],["sent","Εστάλησαν"],["draft","Πρόχειρα"]].map(([v,l])=>(
                  <button key={v} onClick={()=>setFlt(v)} style={{padding:"7px 16px",borderRadius:8,border:`1px solid ${flt===v?C.blue:C.border}`,cursor:"pointer",fontSize:13,fontWeight:flt===v?600:400,background:flt===v?C.blueL:C.white,color:flt===v?C.blue:C.text2}}>{l}</button>
                ))}
              </div>
              <div style={card}>
                {list.length===0?<div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}>Δεν υπάρχουν παραστατικά</div>:(
                  <div style={{overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:800}}>
                      <thead><tr>{["Αρ.","Τύπος","Αντισυμβαλλόμενος","Ημ/νία","Καθαρό","ΦΠΑ","Σύνολο","MARK","Κατάσταση",""].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
                      <tbody>
                        {list.map(inv=>(
                          <tr key={inv.id} onMouseEnter={e=>e.currentTarget.style.background="#f9fafb"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                            <td style={{...td,color:C.blue,fontWeight:600,fontFamily:"monospace"}}>{inv.series}{inv.number}</td>
                            <td style={{...td,color:C.muted,fontSize:12}}>{inv.type}</td>
                            <td style={{...td,fontWeight:500}}>{inv.cpName||"—"}</td>
                            <td style={{...td,color:C.muted}}>{inv.date||inv.issueDate}</td>
                            <td style={td}>€{fmt(inv.totalNet||0)}</td>
                            <td style={{...td,color:C.muted}}>€{fmt(inv.totalVat||0)}</td>
                            <td style={{...td,fontWeight:600}}>€{fmt(inv.totalGross||0)}</td>
                            <td style={{...td,fontFamily:"monospace",fontSize:11,color:"#9ca3af"}}>{inv.mark||"—"}</td>
                            <td style={td}><Badge type={inv.status==="sent"?"sent":"draft"}>{inv.status==="sent"?"✓ myDATA":"Πρόχειρο"}</Badge></td>
                            <td style={td}><Btn v="secondary" sm onClick={()=>makePDF(inv,cfg)}>PDF</Btn></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          );
        })()}

        {/* SETTINGS */}
        {page==="settings"&&(()=>{
          const [lc,setLc]=useState(cfg);
          const save=()=>{saveCfg(lc);toast$("Αποθηκεύτηκαν","ok");};
          return(
            <div>
              <div style={{marginBottom:24}}><h1 style={{fontSize:24,fontWeight:700}}>Ρυθμίσεις</h1></div>
              <div style={card}>
                <h3 style={{fontSize:14,fontWeight:600,marginBottom:16}}>Στοιχεία Επαγγελματία</h3>
                <div style={row}>
                  <div style={col()}><label style={lbl}>Επωνυμία / Ονοματεπώνυμο</label><input style={inp} value={lc.name} onChange={e=>setLc({...lc,name:e.target.value})}/></div>
                  <div style={col()}><label style={lbl}>ΑΦΜ</label><input style={inp} value={lc.afm} onChange={e=>setLc({...lc,afm:e.target.value})}/></div>
                </div>
                <div style={{...row,marginTop:14}}>
                  <div style={col(2)}><label style={lbl}>Διεύθυνση</label><input style={inp} value={lc.addr} onChange={e=>setLc({...lc,addr:e.target.value})}/></div>
                </div>
              </div>
              <div style={card}>
                <h3 style={{fontSize:14,fontWeight:600,marginBottom:8}}>Αρίθμηση</h3>
                <div style={row}>
                  <div style={col(.5)}><label style={lbl}>Σειρά</label><input style={inp} value={lc.series} onChange={e=>setLc({...lc,series:e.target.value})}/></div>
                  <div style={col(.5)}><label style={lbl}>Επόμενος Α/Α</label><input type="number" style={inp} value={lc.nextNum} onChange={e=>setLc({...lc,nextNum:Number(e.target.value)})}/></div>
                </div>
              </div>
              <div style={card}>
                <div style={{fontWeight:600,color:C.green,marginBottom:4}}>✓ Αναζήτηση ΑΦΜ (ΓΓΠΣ)</div>
                <div style={{fontSize:13,color:C.muted}}>Γράψε ΑΦΜ στο νέο παραστατικό και πάτα 🔍 ΓΓΠΣ για αυτόματη συμπλήρωση.</div>
              </div>
              {sb&&user&&!user.demo&&<div style={{...card,borderColor:"#a7f3d0"}}>
                <div style={{fontWeight:600,color:C.green,marginBottom:4}}>☁ Cloud Sync ενεργό</div>
                <div style={{fontSize:13,color:C.muted}}>{user.email}</div>
              </div>}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:40}}>
                {invoices.length>0&&<button onClick={()=>{if(confirm("Διαγραφή ΟΛΩΝ;")){{setInvs([]);lsSet("myd_inv",[]);toast$("Διαγράφηκαν");};}}} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:13}}>Εκκαθάριση δεδομένων</button>}
                <Btn v="primary" onClick={save}>Αποθήκευση</Btn>
              </div>
            </div>
          );
        })()}

      </div>

      {/* Toast */}
      {toast&&<div style={{position:"fixed",bottom:24,right:24,zIndex:9999,padding:"12px 20px",borderRadius:10,fontSize:13,fontWeight:500,boxShadow:"0 4px 16px rgba(0,0,0,.12)",background:toast.type==="ok"?C.greenL:C.redL,border:`1px solid ${toast.type==="ok"?"#a7f3d0":"#fca5a5"}`,color:toast.type==="ok"?C.green:C.red}}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
